<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ShoeEase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#344443] flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all hover:scale-[1.01]">
        <div class="flex flex-col items-center mb-8">
            <img src="pictures/1733572202531.jpg" alt="ShoeEase Logo" class="w-20 h-20 rounded-full shadow-lg mb-4 object-cover border-2 border-orange-500">
            <h1 class="text-3xl font-black text-slate-800 italic tracking-tighter">SHOE<span class="text-orange-500">EASE</span></h1>
            <p class="text-gray-500 text-sm mt-2">Join the ultimate footwear community</p>
        </div>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Full Name</label>
                <input type="text" id="signupName" required placeholder="John Doe" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-orange-500 focus:bg-white outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="name@example.com" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-orange-500 focus:bg-white outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Password1</label>
                <input type="password" id="signupPassword" required placeholder="••••••••" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-orange-500 focus:bg-white outline-none transition">
                <p id="passStrength" class="text-[10px] mt-1 font-bold text-gray-400 transition-all">
                    Minimum 6 characters required
                </p>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg shadow-lg transition-transform active:scale-95">
                Create Account
            </button>
        </form>

        <div class="mt-8 text-center border-t pt-6">
            <p class="text-gray-600 text-sm">
                Already have an account? 
                <a href="login.html" class="text-orange-500 font-bold hover:underline">Log In</a>
            </p>
        </div>
    </div>

    <script>
    const passwordInput = document.getElementById('signupPassword');
    const passStrength = document.getElementById('passStrength');

    passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        if (val.length >= 6) {
            passStrength.innerText = "✓ Password is valid";
            passStrength.className = "text-[10px] mt-1 font-bold text-green-500";
        } else if (val.length > 0) {
            passStrength.innerText = "✗ Too short (Need " + (6 - val.length) + " more)";
            passStrength.className = "text-[10px] mt-1 font-bold text-red-500";
        } else {
            passStrength.innerText = "Minimum 6 characters required";
            passStrength.className = "text-[10px] mt-1 font-bold text-gray-400";
        }
    });

    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('signupEmail').value.trim();
        const password = passwordInput.value;
        if (password.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }
        const users = JSON.parse(localStorage.getItem('shoeease_users') || '[]');
        if (users.find(u => u.email === email)) {
            alert("An account with this email already exists.");
            return;
        }
        users.push({ email, password });
        localStorage.setItem('shoeease_users', JSON.stringify(users));
        alert("Account Created! Redirecting to login...");
        window.location.href = "login.html";
    });
    </script>
</body>
</html>
