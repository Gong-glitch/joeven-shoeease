<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShoeEase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#344443] flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
            <img src="pictures/1733572202531.jpg" alt="ShoeEase Logo" class="w-20 h-20 rounded-full shadow-lg mb-4 object-cover border-2 border-orange-500">
            <h1 class="text-3xl font-black text-slate-800 italic tracking-tighter">SHOE<span class="text-orange-500">EASE</span></h1>
            <p class="text-gray-500 text-sm mt-1">Welcome back! Please login to your account.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Username</label>
                <input type="text" id="username" required placeholder="Enter username" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-orange-500 focus:bg-white outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-orange-500 focus:bg-white outline-none transition">
                    <span id="togglePassword" class="absolute right-3 top-3.5 cursor-pointer text-gray-400 hover:text-orange-500">👁️</span>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" id="remember" class="mr-2 accent-orange-500">
                    Remember Me
                </label>
                <a href="#" class="text-xs text-orange-500 font-bold hover:underline">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg shadow-lg transition-transform active:scale-95">
                Login
            </button>

            <p id="errorMsg" class="text-red-500 text-xs text-center font-semibold mt-2 min-h-[1rem]"></p>
        </form>

        <div class="mt-8 text-center border-t pt-6">
            <p class="text-gray-600 text-sm">
                Don't have an account? 
                <a href="signup.html" class="text-orange-500 font-bold hover:underline">Register Now</a>
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerText = type === 'password' ? '👁️' : '🙈';
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const users = JSON.parse(localStorage.getItem('shoeease_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('shoeease_session', JSON.stringify({ email: user.email }));
                window.location.href = "index.html";
            } else {
                errorMsg.innerText = "❌ Login Error: Invalid email or password.";
            }
        });
    </script>
    </body>
</html>
